name: Job Monitor Cron

on:
  schedule:
    # Corre de lunes a viernes a las 11:00 UTC (08:00 AM hora de Chile)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite actualizar el historial_empleos.json en el repo

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: |
          pip install -r requirements.txt

      - name: Ejecutar rastreador de ofertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Guardar historial de ofertas actualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_empleos.json
          git commit -m "chore: update job history [skip ci]" || echo "No changes to commit"
          git push