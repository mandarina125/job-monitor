name: Job Monitor Cron

on:
  schedule:
    # Lunes a viernes a las 11:00 UTC (08:00 AM Chile)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: |
          pip install -r requirements.txt

      - name: Ejecutar rastreador de ofertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Guardar historial si hubo ofertas nuevas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update job history [skip ci]"
          file_pattern: "historial_empleos.json"